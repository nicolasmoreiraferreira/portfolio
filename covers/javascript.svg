<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Capa do projeto Estudos de JavaScript">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#1a1508"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="980" cy="180" r="360" fill="url(#glow)"/>

  <!-- Barra de janela -->
  <rect x="150" y="120" width="900" height="510" rx="18" fill="#0e1424" fill-opacity="0.92" stroke="#94a3b8" stroke-opacity="0.18"/>
  <rect x="150" y="120" width="900" height="52" rx="18" fill="#ffffff" fill-opacity="0.035"/>
  <circle cx="188" cy="146" r="8" fill="#fb7185" fill-opacity="0.75"/>
  <circle cx="214" cy="146" r="8" fill="#fbbf24" fill-opacity="0.75"/>
  <circle cx="240" cy="146" r="8" fill="#34d399" fill-opacity="0.75"/>
  <text x="280" y="152" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="16" fill="#64748b">logica.js</text>

  <!-- Código -->
  <g font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="23" xml:space="preserve">
    <text x="192" y="228" fill="#818cf8">function</text>
    <text x="312" y="228" fill="#67e8f9">analisarNumero</text>
    <text x="500" y="228" fill="#94a3b8">(valor) {</text>

    <text x="228" y="272" fill="#818cf8">if</text>
    <text x="278" y="272" fill="#94a3b8">(</text>
    <text x="292" y="272" fill="#67e8f9">valor</text>
    <text x="378" y="272" fill="#94a3b8">% 2 === 0) {</text>

    <text x="264" y="316" fill="#818cf8">return</text>
    <text x="372" y="316" fill="#34d399">'par'</text>
    <text x="446" y="316" fill="#94a3b8">;</text>

    <text x="228" y="360" fill="#94a3b8">}</text>
    <text x="228" y="404" fill="#818cf8">return</text>
    <text x="336" y="404" fill="#34d399">'ímpar'</text>
    <text x="428" y="404" fill="#94a3b8">;</text>
    <text x="192" y="448" fill="#94a3b8">}</text>

    <text x="192" y="506" fill="#64748b">// eventos + DOM</text>
    <text x="192" y="550" fill="#facc15">document</text>
    <text x="336" y="550" fill="#94a3b8">.</text>
    <text x="350" y="550" fill="#67e8f9">querySelector</text>
    <text x="530" y="550" fill="#94a3b8">(</text>
    <text x="544" y="550" fill="#34d399">'#resultado'</text>
    <text x="706" y="550" fill="#94a3b8">)</text>
  </g>

  <!-- Etiqueta -->
  <rect x="150" y="660" width="330" height="46" rx="23" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.45"/>
  <text x="182" y="690" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="20" fill="#fde68a">JavaScript · DOM · Lógica</text>
</svg>
