<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Capa do projeto BOTSNAY: aplicação desktop em Python com automação de navegador">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="55%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#06121f"/>
    </linearGradient>
    <linearGradient id="titles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2740"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3776ab" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3776ab" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="1010" cy="140" r="330" fill="url(#glow)"/>

  <!-- Janela da aplicação desktop -->
  <rect x="120" y="96" width="960" height="520" rx="16" fill="#0b1020" fill-opacity="0.95" stroke="#94a3b8" stroke-opacity="0.2"/>
  <rect x="120" y="96" width="960" height="46" rx="16" fill="url(#titles)"/>
  <rect x="120" y="128" width="960" height="14" fill="url(#titles)"/>
  <circle cx="152" cy="119" r="7" fill="#fb7185" fill-opacity="0.75"/>
  <circle cx="176" cy="119" r="7" fill="#fbbf24" fill-opacity="0.75"/>
  <circle cx="200" cy="119" r="7" fill="#34d399" fill-opacity="0.75"/>
  <text x="232" y="125" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="15" fill="#7c8aa3">BOTSNAY — automação desktop</text>

  <!-- Sidebar de controle -->
  <rect x="120" y="142" width="230" height="474" fill="#0e1424" fill-opacity="0.85"/>
  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="16">
    <rect x="136" y="164" width="198" height="34" rx="8" fill="#3776ab" fill-opacity="0.22"/>
    <text x="152" y="186" fill="#7dd3fc">Painel de execução</text>
    <text x="152" y="224" fill="#8fa0b8">Fluxo de automação</text>
    <text x="152" y="258" fill="#8fa0b8">Verificação de SMS</text>
    <text x="152" y="292" fill="#8fa0b8">Operações financeiras</text>
    <text x="152" y="326" fill="#8fa0b8">Proxy e sessões</text>
    <text x="152" y="360" fill="#8fa0b8">Atualização remota</text>
  </g>
  <line x1="350" y1="142" x2="350" y2="616" stroke="#94a3b8" stroke-opacity="0.14"/>

  <!-- Painel de log -->
  <g font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="16" xml:space="preserve">
    <text x="376" y="180" fill="#64748b">[12:04:07]</text>
    <text x="474" y="180" fill="#34d399">sessão iniciada</text>
    <text x="376" y="212" fill="#64748b">[12:04:09]</text>
    <text x="474" y="212" fill="#cbd5e1">navegador → contexto isolado</text>
    <text x="376" y="244" fill="#64748b">[12:04:12]</text>
    <text x="474" y="244" fill="#cbd5e1">página carregada e validada</text>
    <text x="376" y="276" fill="#64748b">[12:04:15]</text>
    <text x="474" y="276" fill="#facc15">aguardando confirmação</text>
    <text x="376" y="308" fill="#64748b">[12:04:18]</text>
    <text x="474" y="308" fill="#34d399">código SMS preenchido</text>
    <text x="376" y="340" fill="#64748b">[12:04:22]</text>
    <text x="474" y="340" fill="#34d399">etapa concluída com sucesso</text>
    <text x="376" y="372" fill="#64748b">[12:04:22]</text>
    <text x="474" y="372" fill="#67e8f9">estado persistido em JSON</text>

    <!-- Bloco de arquitetura -->
    <text x="376" y="446" fill="#64748b"># arquitetura</text>
    <text x="376" y="482" fill="#818cf8">Python</text>
    <text x="452" y="482" fill="#94a3b8">·</text>
    <text x="474" y="482" fill="#67e8f9">Playwright</text>
    <text x="576" y="482" fill="#94a3b8">·</text>
    <text x="598" y="482" fill="#a5b4fc">Tkinter / ttkbootstrap</text>
    <text x="376" y="514" fill="#818cf8">Threading</text>
    <text x="478" y="514" fill="#94a3b8">·</text>
    <text x="500" y="514" fill="#67e8f9">JSON</text>
    <text x="552" y="514" fill="#94a3b8">·</text>
    <text x="574" y="514" fill="#a5b4fc">APIs REST</text>
    <text x="376" y="546" fill="#818cf8">Extensão Chrome</text>
    <text x="524" y="546" fill="#94a3b8">·</text>
    <text x="546" y="546" fill="#67e8f9">JavaScript</text>
    <text x="658" y="546" fill="#94a3b8">·</text>
    <text x="680" y="546" fill="#a5b4fc">GitHub Actions</text>
  </g>

  <!-- Indicador de execução -->
  <rect x="836" y="536" width="212" height="44" rx="22" fill="#34d399" fill-opacity="0.13" stroke="#34d399" stroke-opacity="0.45"/>
  <circle cx="866" cy="558" r="7" fill="#34d399"/>
  <text x="886" y="564" font-family="Inter, 'Segoe UI', sans-serif" font-size="16" fill="#6ee7b7">em produção</text>

  <!-- Etiqueta inferior -->
  <rect x="120" y="656" width="404" height="46" rx="23" fill="#3776ab" fill-opacity="0.16" stroke="#3776ab" stroke-opacity="0.5"/>
  <text x="152" y="686" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="19" fill="#93c5fd">Python · Automação · Desktop</text>
</svg>
