name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# `contents: write` é necessário para publicar na branch gh-pages.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Verificar, buildar e publicar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build de produção
        run: npm run build

      # Publica o conteúdo de dist/ na branch gh-pages, que é a origem
      # configurada em Settings > Pages. O pipeline só publica se as
      # etapas de qualidade acima passarem.
      - name: Publicar na branch gh-pages
        run: |
          set -e
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: publica o portfólio no GitHub Pages"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
